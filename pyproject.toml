[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reel-finder-movie-recommender"
version = "1.0.0"
description = "Content and popularity-based movie recommendations with TF-IDF and cosine similarity"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "streamlit>=1.32",
]

[project.optional-dependencies]
test = ["pytest>=7.4"]

[project.scripts]
movie-recommender = "movie_recommender.cli:main"

[tool.setuptools]
packages = ["movie_recommender"]
include-package-data = true

[tool.setuptools.package-data]
movie_recommender = ["sample_movies.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
